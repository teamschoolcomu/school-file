<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="initial-scale=1.0,maximum-scale=1.01, minimal-ui"/>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{-ms-touch-action:none;touch-action:none;-webkit-tap-highlight-color:rgba(0,0,0,0);user-select:none;-webkit-touch-callout:none;-webkit-user-select:none}
</style>
<script>
(function () {
    function store(name) {
        var mem = {}, real = null;
        try { real = window[name]; var k = '__t'; real.setItem(k, k); real.removeItem(k); } catch (e) { real = null; }
        return {
            getItem: function (k) { try { return real ? real.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return k in mem ? mem[k] : null; } },
            setItem: function (k, v) { v = String(v); mem[k] = v; try { real && real.setItem(k, v); } catch (e) {} },
            removeItem: function (k) { delete mem[k]; try { real && real.removeItem(k); } catch (e) {} },
            clear: function () { mem = {}; try { real && real.clear(); } catch (e) {} },
            key: function (i) { try { return real ? real.key(i) : Object.keys(mem)[i] || null; } catch (e) { return null; } },
            get length() { try { return real ? real.length : Object.keys(mem).length; } catch (e) { return 0; } }
        };
    }
    var noop = function () {}, ok = function () { return Promise.resolve(); };
    window.famobi = {
        config: { aid: '', features: { lockPointer: false } },
        localStorage: store('localStorage'),
        sessionStorage: store('sessionStorage'),
        hasFeature: function () { return false; },
        moreGamesLink: noop,
        getMoreGamesButtonImage: function () { return "https://cdn.jsdelivr.net/gh/teamschoolcomu/school-file@main/assets/more-games-button.png"; },
        log: noop, onRequest: noop, gameReady: noop, playerReady: noop, showAd: function (cb) { if (typeof cb === 'function') cb(); }
    };
    window.famobi_analytics = {
        trackEvent: ok, trackScreen: ok, trackStats: ok,
        EVENT_LEVELSTART: 'EVENT_LEVELSTART', EVENT_LEVELSUCCESS: 'EVENT_LEVELSUCCESS', EVENT_LEVELFAIL: 'EVENT_LEVELFAIL', EVENT_LEVELRESTART: 'EVENT_LEVELRESTART',
        SCREEN_HOME: 'SCREEN_HOME', SCREEN_LEVEL: 'SCREEN_LEVEL', SCREEN_LEVELINTRO: 'SCREEN_LEVELINTRO', SCREEN_LEVELRESULT: 'SCREEN_LEVELRESULT', SCREEN_PAUSE: 'SCREEN_PAUSE', SCREEN_CREDITS: 'SCREEN_CREDITS'
    };
    window.adConfig = function () { return false; };
    window.adBreak = function (o) { if (o && typeof o.adBreakDone === 'function') setTimeout(function () { o.adBreakDone({ breakStatus: 'notReady' }); }, 0); };
    window.open = function () { return null; };
})();
</script>
</head>
<body>
<div id="canvas-wrapper" style="overflow:hidden;width:100%;height:100%;margin:0;padding:0;position:absolute;">
<canvas id="canvas" moz-opaque></canvas>
</div>
<script src="https://cdn.jsdelivr.net/gh/teamschoolcomu/school-file@main/js/all.js"></script>
<script>extGameLoad();</script>
</body>
</html>
